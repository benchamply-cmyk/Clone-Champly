# Démarrage : cp .env.example .env (puis le remplir), puis docker compose up -d
services:
  assistant:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - assistant-data:/data
    ports:
      - "127.0.0.1:3000:3000" # exposé seulement en local : le reverse proxy HTTPS (Caddy) se place devant
    restart: unless-stopped

  # Étape suivante de la mémoire : PostgreSQL + pgvector (schéma dans db/schema.sql).
  # Pas encore utilisé par le code ; décommenter quand le stockage PostgreSQL sera branché.
  # db:
