# Déploiement de l'assistant sur Render (render.com) : New > Blueprint, puis choisir ce dépôt.
# Le site vitrine reste sur Netlify ; l'assistant est publié sur un sous-domaine (ex. api.champly.fr).
services:
  - type: web
    name: champly-assistant
    runtime: node
    region: frankfurt
    plan: starter # le disque permanent (mémoire de l'assistant) demande une offre payante
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # à saisir dans Render, jamais dans le dépôt
      - key: ASSISTANT_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: MODEL_MAIN
        value: claude-opus-5-5
      - key: MODEL_FAST
        value: claude-haiku-5-5
      - key: EFFORT_MAIN
        value: high
    disk:
      name: memoire
      mountPath: /var/data
      sizeGB: 1
