# Netlify sert la page de discussion (public/) ; le cerveau de l'assistant tourne sur Render (render.yaml).
# Toutes les adresses /api/* de champly.fr sont relayées vers le service Render, sans changer d'adresse.
[build]
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://champly-assistant.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
